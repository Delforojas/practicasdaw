<main
  class="relative flex min-h-[100svh] items-center justify-center overflow-x-hidden
         bg-[#0B1524] bg-cover bg-center px-4 py-8 sm:px-6 sm:py-12"
  style="background-image: url('/avengers-bg.jpg')"
>
  <!-- Fondo ambiental -->
  <div class="absolute inset-0 bg-[#0B1524]/75"></div>
  <div class="absolute inset-0 bg-gradient-to-b from-[#0B1524]/35 via-[#0B1524]/70 to-[#0B1524]/95"></div>

  <!-- Panel de recuperación -->
  <section
    class="relative w-full min-w-0 max-w-md rounded-2xl border border-[#243B6B]
           border-t-2 border-t-[#B51F2E] bg-[#172A46]/70 p-5
           shadow-2xl shadow-black/35 backdrop-blur-md sm:p-7"
    aria-labelledby="recovery-title"
  >
    <img
      src="/landing-assets/images-hero/avengers-logo.webp"
      alt="Logotipo de Avengers"
      class="mx-auto mb-5 w-28 object-contain drop-shadow-xl sm:w-32"
    />

    <!-- Identificación -->
    <div class="mb-6">
      <div class="flex items-center justify-center gap-3">
        <span class="h-px w-8 bg-[#B51F2E]"></span>
        <span class="text-xs font-bold tracking-[0.24em] text-[#B51F2E]">
          S.H.I.E.L.D.
        </span>
        <span class="h-px w-8 bg-[#B51F2E]"></span>
      </div>
      <p class="mt-3 text-center text-xs font-semibold tracking-[0.2em] text-[#B8C4D6]">
        SECURE ACCESS SYSTEM
      </p>
      <h1
        id="recovery-title"
        class="mt-3 text-center text-xl font-bold tracking-wide text-[#E3E8ED] sm:text-2xl"
      >
        RECUPERACIÓN DE ACCESO
      </h1>
      <p class="mt-3 text-center text-sm leading-6 text-[#B8C4D6]">
        Introduce el correo asociado a tu cuenta y recibirás las instrucciones necesarias para recuperar el acceso.
      </p>
    </div>

    <!-- Formulario -->
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <!-- Email -->
      <div>
        <label for="recovery-email" class="mb-2 block text-sm font-medium text-[#E3E8ED]">
          Correo electrónico
        </label>
        <input
          id="recovery-email"
          type="email"
          formControlName="email"
          placeholder="agente@shield.com"
          class="w-full min-w-0 rounded-lg border border-[#243B6B] bg-[#0B1524]/85
                 px-4 py-3 text-sm text-[#E3E8ED] outline-none
                 placeholder:text-[#B8C4D6]/55 focus:border-[#B51F2E]
                 focus:ring-2 focus:ring-[#B51F2E]/30 transition-colors duration-200"
          [ngClass]="{ 'border-red-500': email?.invalid && email?.touched }"
        />

        <div *ngIf="email?.invalid && email?.touched" class="mt-2 text-xs leading-5 text-red-400">
          <span *ngIf="email?.errors?.['required']">El email es obligatorio.</span>
          <span *ngIf="email?.errors?.['email']">Introduce un email válido.</span>
        </div>
      </div>

      <!-- Acción principal -->
      <button
        type="submit"
        class="btn-avengers w-full !py-3 text-sm tracking-[0.1em]"
      >
        ENVIAR ENLACE DE RECUPERACIÓN
      </button>
    </form>

    <!-- Volver al login -->
    <p class="mt-6 text-center text-sm text-[#B8C4D6]">
      ¿Recuerdas tu contraseña?
      <a
        routerLink="/login"
        class="ml-1 font-semibold text-[#E3E8ED] transition-colors duration-200 hover:text-[#B51F2E] hover:underline"
      >
        Inicia sesión
      </a>
    </p>
  </section>
</main>
