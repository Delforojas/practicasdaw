<section
  class="w-full min-w-0 overflow-hidden rounded-2xl border border-[#243B6B]
         border-t-2 border-t-[#B51F2E] bg-[#172A46]/75 p-4
         shadow-2xl shadow-black/30 backdrop-blur-md sm:p-6 lg:p-8"
  aria-labelledby="active-operations-title"
>
  <!-- Cabecera del módulo -->
  <div class="mb-7 text-center">
    <div class="flex items-center justify-center gap-3">
      <span class="h-px w-8 bg-[#B51F2E]"></span>
      <span class="text-xs font-bold tracking-[0.24em] text-[#B51F2E]">
        S.H.I.E.L.D.
      </span>
      <span class="h-px w-8 bg-[#B51F2E]"></span>
    </div>
    <h2
      id="active-operations-title"
      class="mt-3 text-xl font-bold tracking-wide text-[#E3E8ED] sm:text-2xl"
    >
      OPERACIONES ACTIVAS
    </h2>
    <p class="mx-auto mt-2 max-w-xl text-sm leading-6 text-[#B8C4D6]">
      Selecciona un Vengador para consultar la operación disponible.
    </p>
  </div>

  <!-- Carrusel existente -->
  <div class="flex w-full min-w-0 items-center justify-center gap-2 sm:gap-4 lg:gap-6">
    <button
      (click)="prev()"
      aria-label="Anterior"
      class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full border
             border-[#243B6B] bg-[#0B1524]/80 text-[#E3E8ED] shadow-lg
             transition-colors duration-200 hover:border-[#B51F2E] hover:bg-[#B51F2E]
             sm:h-12 sm:w-12"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 32 32" stroke="currentColor" class="h-6 w-6 sm:h-7 sm:w-7">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M20 8l-8 8 8 8" />
      </svg>
    </button>

    @for (c of visibleImages; track c.name; let i = $index) {
      <div
        class="min-w-0 transition-transform duration-300 flex flex-col items-center"
        [ngClass]="{
          'scale-110 z-10': i === 1,
          'scale-90 opacity-50 z-0': i !== 1
        }"
      >
        <div class="relative flex min-w-0 flex-col items-center">
          @if(i === 1) {
            <div
              class="flex aspect-square h-32 w-32 items-center justify-center overflow-hidden
                     rounded-2xl border-2 border-[#B51F2E] bg-[#0B1524] shadow-2xl
                     shadow-black/40 sm:h-40 sm:w-40 md:h-52 md:w-52 lg:h-64 lg:w-64"
            >
              <img
                [src]="c.img"
                [alt]="c.name"
                class="block h-full w-full object-cover"
              />
            </div>
          } @else {
            <img
              [src]="c.img"
              [alt]="c.name"
              class="hidden cursor-pointer rounded-2xl border border-[#243B6B]
                     object-cover shadow-xl sm:block sm:h-20 sm:w-20
                     md:h-32 md:w-32 lg:h-40 lg:w-40"
              (click)="i === 0 ? prev() : i === 2 ? next() : null"
            />
          }

          @if(i === 1) {
            <button
              class="btn-avengers mt-4 max-w-full !px-3 !py-2 text-sm sm:text-base"
              (click)="goTo(c.path)"
            >
              {{ c.name }}
            </button>
          }
        </div>

        @if(i !== 1) {
          <p class="mt-3 hidden text-center text-sm text-[#B8C4D6] sm:block md:text-base">
            {{ c.name }}
          </p>
        }
      </div>
    }

    <button
      (click)="next()"
      aria-label="Siguiente"
      class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full border
             border-[#243B6B] bg-[#0B1524]/80 text-[#E3E8ED] shadow-lg
             transition-colors duration-200 hover:border-[#B51F2E] hover:bg-[#B51F2E]
             sm:h-12 sm:w-12"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 32 32" stroke="currentColor" class="h-6 w-6 sm:h-7 sm:w-7">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 8l8 8-8 8" />
      </svg>
    </button>
  </div>
</section>
