<footer class="bg-[#0B1524] text-[#E3E8ED] border-t-4 border-[#B51F2E] py-8">

  <div
    class="max-w-7xl mx-auto px-6 grid grid-cols-1 xl:grid-cols-3 items-center
           border-b border-[#E3E8ED]/20 pb-6 gap-8"
  >

    <!-- LOGO -->
    <div class="flex justify-center xl:justify-start">
      <img
        src="/avengers-logo.webp"
        alt="Avengers Logo"
        class="h-16 md:h-20 lg:h-24 xl:h-28 object-contain"
      />
    </div>


    <!-- MENÚ -->
    <ul
      class="flex flex-col md:flex-row justify-center
             gap-6 lg:gap-10 text-center"
    >
      @for (link of footerLinks; track link.label) {

        <li>
          <a
            [routerLink]="[link.path]"
            [fragment]="link.fragment"
            class="text-[#E3E8ED]
                   hover:text-[#B51F2E]
                   font-medium
                   whitespace-nowrap
                   transition-colors duration-300"
          >
            {{ link.label }}
          </a>
        </li>

      }
    </ul>


    <!-- IDENTIFICACIÓN S.H.I.E.L.D. -->
    <div class="hidden xl:flex justify-end items-center gap-2">

      <!-- Indicador -->
      <span
        class="w-2 h-2 bg-[#B51F2E] rounded-full
               shadow-[0_0_8px_rgba(181,31,46,0.8)]"
      ></span>

      <span class="text-xs tracking-[0.2em] text-[#B8C4D6]">
        S.H.I.E.L.D.
      </span>

    </div>

  </div>


  <!-- PARTE INFERIOR -->
  <div
    class="max-w-7xl mx-auto px-6
           flex flex-col md:flex-row
           justify-between items-center
           gap-6 mt-6"
  >

    <!-- REDES SOCIALES -->
    <div class="flex gap-5">

      <!-- Linkedin -->
      <a
        href="https://www.linkedin.com/in/delfinrojas/"
        target="_blank"
        rel="noopener noreferrer"
        class="opacity-70 hover:opacity-100 hover:scale-110
               transition-all duration-300"
      >
        <img
          src="footer-assets/social-media/linkedin.png"
          alt="Linkedin"
          class="h-12 w-12 brightness-0 invert"
        />
      </a>


      <!-- GitHub-->
      <a
        href="https://github.com/Delforojas"
        target="_blank"
        rel="noopener noreferrer"
        class="opacity-70 hover:opacity-100 hover:scale-110
               transition-all duration-300"
      >
        <img
          src="footer-assets/social-media/github.png"
          alt="GitHub"
          class="h-12 w-13 brightness-0 invert"
        />
      </a>


      <!-- Página Web -->
      <a
        href="https://delforojas.es/"
        target="_blank"
        rel="noopener noreferrer"
        class="opacity-70 hover:opacity-100 hover:scale-110
               transition-all duration-300"
      >
        <img
          src="footer-assets/social-media/delforojas.ico"
          alt="Portfolio"
          class="h-12 w-13
           brightness-0 invert"
        />
      </a>
      <a

  href="mailto:delfinrojasespina@gmail.com"

  class="opacity-70 hover:opacity-100 hover:scale-110

         transition-all duration-300"

  aria-label="Email"

>

  <img

    src="footer-assets/social-media/gmail.png"

    alt="Email"

    class="h-12 w-13 brightness-0 invert"

  />

</a>

    </div>


    <!-- COPYRIGHT -->
    <div class="text-sm text-[#B8C4D6] text-center md:text-right">

      © 2026 Avengers Initiative
      <span class="text-[#B51F2E] mx-2">|</span>
      S.H.I.E.L.D.

    </div>

  </div>

</footer>
