<nav
  class="sticky top-0 z-50 w-full border-b border-[#243B6B] bg-[#0B1524]/95
         text-[#E3E8ED] shadow-lg shadow-black/25 backdrop-blur-md"
  aria-label="Navegación privada S.H.I.E.L.D."
>
  <div class="mx-auto flex min-h-16 w-full max-w-7xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
    <!-- Identidad -->
    <a routerLink="/user" (click)="closeMenu()" class="flex min-w-0 items-center gap-3">
      <img src="/avengers-logo.webp" alt="Avengers" class="h-8 w-auto shrink-0 object-contain sm:h-9" />
      <span class="hidden h-7 w-px bg-[#B51F2E] sm:block"></span>
      <span class="hidden min-w-0 sm:block">
        <span class="block text-xs font-bold tracking-[0.2em] text-[#E3E8ED]">S.H.I.E.L.D.</span>
        <span class="block text-[0.65rem] tracking-[0.16em] text-[#B8C4D6]">PRIVATE NETWORK</span>
      </span>
    </a>

    <!-- Navegación desktop -->
    <div class="hidden items-center gap-2 md:flex lg:gap-3">
      <a
        routerLink="/user"
        routerLinkActive="border-[#B51F2E] bg-[#172A46] text-[#E3E8ED]"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        class="rounded-lg border border-transparent px-3 py-2 text-sm font-medium
               text-[#B8C4D6] transition-colors duration-200 hover:border-[#243B6B]
               hover:bg-[#172A46]/70 hover:text-[#E3E8ED]"
      >
        Centro de Operaciones
      </a>
      <a
        routerLink="/user-profile"
        routerLinkActive="border-[#B51F2E] bg-[#172A46] text-[#E3E8ED]"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        class="rounded-lg border border-transparent px-3 py-2 text-sm font-medium
               text-[#B8C4D6] transition-colors duration-200 hover:border-[#243B6B]
               hover:bg-[#172A46]/70 hover:text-[#E3E8ED]"
      >
        Mi expediente
      </a>
      <button
        type="button"
        (click)="logout()"
        [disabled]="isLoggingOut"
        class="rounded-lg border border-[#B51F2E]/80 px-3 py-2 text-sm font-semibold
               text-[#E3E8ED] transition-colors duration-200 hover:bg-[#B51F2E]/80
               disabled:cursor-wait disabled:opacity-60"
      >
        @if (isLoggingOut) {
          Cerrando...
        } @else {
          Cerrar sesión
        }
      </button>
    </div>

    <!-- Control móvil -->
    <button
      type="button"
      (click)="toggleMenu()"
      class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg border
             border-[#243B6B] text-[#E3E8ED] transition-colors duration-200
             hover:border-[#B51F2E] hover:bg-[#172A46] md:hidden"
      [attr.aria-expanded]="menuOpen"
      aria-controls="private-mobile-menu"
      [attr.aria-label]="menuOpen ? 'Cerrar menú privado' : 'Abrir menú privado'"
    >
      @if (menuOpen) {
        <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      } @else {
        <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      }
    </button>
  </div>

  <!-- Navegación móvil -->
  @if (menuOpen) {
    <div id="private-mobile-menu" class="border-t border-[#243B6B] bg-[#0B1524] px-4 py-4 md:hidden">
      <div class="mx-auto flex w-full max-w-7xl flex-col gap-2">
        <a
          routerLink="/user"
          routerLinkActive="border-[#B51F2E] bg-[#172A46] text-[#E3E8ED]"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
          (click)="closeMenu()"
          class="rounded-lg border border-transparent px-4 py-3 text-sm font-medium
                 text-[#B8C4D6] transition-colors duration-200 hover:bg-[#172A46] hover:text-[#E3E8ED]"
        >
          Centro de Operaciones
        </a>
        <a
          routerLink="/user-profile"
          routerLinkActive="border-[#B51F2E] bg-[#172A46] text-[#E3E8ED]"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
          (click)="closeMenu()"
          class="rounded-lg border border-transparent px-4 py-3 text-sm font-medium
                 text-[#B8C4D6] transition-colors duration-200 hover:bg-[#172A46] hover:text-[#E3E8ED]"
        >
          Mi expediente
        </a>
        <button
          type="button"
          (click)="logout()"
          [disabled]="isLoggingOut"
          class="mt-1 w-full rounded-lg border border-[#B51F2E]/80 px-4 py-3 text-left
                 text-sm font-semibold text-[#E3E8ED] transition-colors duration-200
                 hover:bg-[#B51F2E]/80 disabled:cursor-wait disabled:opacity-60"
        >
          @if (isLoggingOut) {
            Cerrando...
          } @else {
            Cerrar sesión
          }
        </button>
      </div>
    </div>
  }

  @if (logoutError) {
    <p class="border-t border-[#B51F2E]/40 bg-[#B51F2E]/15 px-4 py-2 text-center text-xs text-red-300" role="alert">
      {{ logoutError }}
    </p>
  }
</nav>
